name: setup-stack
description: >
  Set up the build/test toolchain for a MicroTodoSuite service by language.
  Fails fast on an unsupported language so a caller typo never silently skips
  the build (spec 003, FR-003).

inputs:
  language:
    description: One of go | node | java | python
    required: true

runs:
  using: composite
  steps:
    - name: Set up Go
      if: ${{ inputs.language == 'go' }}
      uses: actions/setup-go@v5
      with:
        go-version: "1.23"

    - name: Set up Node.js
      if: ${{ inputs.language == 'node' }}
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Set up Java
      if: ${{ inputs.language == 'java' }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "8"

    - name: Set up Python
      if: ${{ inputs.language == 'python' }}
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Reject unsupported language
      if: ${{ !contains(fromJSON('["go","node","java","python"]'), inputs.language) }}
      shell: bash
      run: |
        echo "::error::unsupported language '${{ inputs.language }}' (expected go|node|java|python)"
        exit 1
