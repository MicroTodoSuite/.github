name: ci

# Reusable CI for every MicroTodoSuite service (spec 003). One definition,
# consumed by a thin caller in each service repo. Build ONCE, address by
# immutable digest, run the quality/supply-chain gates, and expose the digest so
# the promotion workflow can open a GitOps pull request. This workflow never
# mutates a cluster.

on:
  workflow_call:
    inputs:
      service-name:
        description: Service identity; matches apps/<service> and the image name
        required: true
        type: string
      language:
        description: go | node | java | python
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile
        default: Dockerfile
        type: string
      registry:
        description: Image destination (GHCR now; ECR later by value change)
        default: ghcr.io/microtodosuite
        type: string
      cloud-enabled:
        description: Enable OIDC-to-AWS + ECR push (inactive until task 1)
        default: false
        type: boolean
      sonar-project-key:
        description: SonarCloud project key; quality gate runs when set
        default: ""
        type: string
      run-unit:
        default: false
        type: boolean
      run-integration:
        default: false
        type: boolean
      run-contract:
        default: false
        type: boolean
      run-e2e:
        default: false
        type: boolean
      run-perf:
        default: false
        type: boolean
      run-dast:
        default: false
        type: boolean
    secrets:
      SONAR_TOKEN:
        required: false
    outputs:
      image-digest:
        description: sha256 digest of the built manifest
        value: ${{ jobs.build.outputs.digest }}
      image-ref:
        description: registry/service@digest
        value: ${{ jobs.build.outputs.ref }}

permissions:
  contents: read

jobs:
  # ---- Unit tests (skippable: no suites exist yet) ------------------------
  unit:
    if: ${{ inputs.run-unit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MicroTodoSuite/.github/.github/actions/setup-stack@v1
        with:
          language: ${{ inputs.language }}
      - name: Run unit tests (fail if enabled but none exist)
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::run-unit=true but no unit test suite is wired for ${{ inputs.service-name }}"
          echo "Author tests and implement this step before enabling the gate (FR-017)."
          exit 1

  # ---- Code-quality gate (active when a Sonar project key is supplied) ----
  quality:
    if: ${{ inputs.sonar-project-key != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ inputs.sonar-project-key }}

  # ---- Build ONCE, push by digest ----------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      ref: ${{ inputs.registry }}/${{ inputs.service-name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cloud legs: inactive until roadmap task 1 delivers the OIDC role + ECR.
      - name: Configure AWS credentials (OIDC)
        if: ${{ inputs.cloud-enabled }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        if: ${{ inputs.cloud-enabled }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (digest is the identity)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          # Immutable git-sha handle only; promotion uses the digest, never a
          # moving tag and never `latest` (FR-006).
          tags: ${{ inputs.registry }}/${{ inputs.service-name }}:${{ github.sha }}
          provenance: false

  # ---- Image vulnerability scan (active, blocking) -----------------------
  image-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trivy scan (blocking on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ needs.build.outputs.ref }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # ---- Supply-chain evidence (active) ------------------------------------
  sbom:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: MicroTodoSuite/.github/.github/actions/sbom@v1
        with:
          image-ref: ${{ needs.build.outputs.ref }}
          artifact-name: sbom-${{ inputs.service-name }}

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: MicroTodoSuite/.github/.github/actions/sign@v1
        with:
          image-ref: ${{ needs.build.outputs.ref }}

  # ---- Skippable test gates (scaffolded; no artifacts yet) ---------------
  integration:
    if: ${{ inputs.run-integration }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Integration (fail if enabled but not wired)
        shell: bash
        run: |
          echo "::error::run-integration=true but Testcontainers suite is not wired (FR-017)"
          exit 1

  contract:
    if: ${{ inputs.run-contract }}
    runs-on: ubuntu-latest
    steps:
      - name: Contract (fail if enabled but not wired)
        shell: bash
        run: |
          echo "::error::run-contract=true but no OpenAPI/AsyncAPI contract + Spectral/Pact suite exists (FR-017)"
          exit 1

  e2e:
    if: ${{ inputs.run-e2e }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: E2E (fail if enabled but not wired)
        shell: bash
        run: |
          echo "::error::run-e2e=true but no Cypress/Playwright suite exists (FR-017)"
          exit 1

  perf:
    if: ${{ inputs.run-perf }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Performance (fail if enabled but not wired)
        shell: bash
        run: |
          echo "::error::run-perf=true but no Locust scenario exists (FR-017)"
          exit 1

  dast:
    if: ${{ inputs.run-dast }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: DAST (fail if enabled but not wired)
        shell: bash
        run: |
          echo "::error::run-dast=true but no OWASP ZAP scan is wired (FR-017)"
          exit 1
