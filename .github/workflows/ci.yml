name: ci

# Reusable CI for every MicroTodoSuite service (spec 003). One definition,
# consumed by a thin caller in each service repo. Build ONCE, address by
# immutable digest, run the quality/supply-chain gates, and expose the digest so
# the promotion workflow can open a GitOps pull request. This workflow never
# mutates a cluster.

on:
  workflow_call:
    inputs:
      service-name:
        description: Service identity; matches apps/<service> and the image name
        required: true
        type: string
      language:
        description: go | node | java | python
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile
        default: Dockerfile
        type: string
      registry:
        description: Image destination (GHCR now; ECR later by value change)
        default: ghcr.io/microtodosuite
        type: string
      cloud-enabled:
        description: Enable OIDC-to-AWS + ECR push (inactive until task 1)
        default: false
        type: boolean
      sonar-project-key:
        description: SonarQube project key; quality gate runs when key + host are set
        default: ""
        type: string
      sonar-host-url:
        description: >
          Self-hosted SonarQube server URL. Both profiles use self-hosted
          SonarQube (team decision, overrides plan §17). Leave empty until the
          server exists; the gate then activates by value alone.
        default: ""
        type: string
      run-unit:
        default: false
        type: boolean
      run-integration:
        default: false
        type: boolean
      run-contract:
        default: false
        type: boolean
      run-e2e:
        default: false
        type: boolean
      run-perf:
        default: false
        type: boolean
      run-dast:
        default: false
        type: boolean
    secrets:
      SONAR_TOKEN:
        required: false
    outputs:
      image-digest:
        description: sha256 digest of the built manifest
        value: ${{ jobs.build.outputs.digest }}
      image-ref:
        description: registry/service@digest
        value: ${{ jobs.build.outputs.ref }}

permissions:
  contents: read

jobs:
  # ---- Unit tests -------------------------------------------------------
  # Convention-based activation (spec 006): a service enables the gate by
  # authoring `ci/unit.sh` (its native runner + coverage) and flipping
  # `run-unit: true`. The reusable structure never changes per stack; a gate
  # turned on without its artifact fails visibly (FR-012). setup-stack provides
  # the toolchain; the per-repo script owns the "how".
  unit:
    if: ${{ inputs.run-unit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MicroTodoSuite/.github/.github/actions/setup-stack@v1
        with:
          language: ${{ inputs.language }}
      - name: Run unit suite (fail visibly if enabled but no artifact)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ci/unit.sh ]; then
            echo "::error::run-unit=true but ci/unit.sh is missing for ${{ inputs.service-name }}"
            echo "Author the unit suite and add ci/unit.sh before enabling the gate (FR-012)."
            exit 1
          fi
          bash ci/unit.sh

  # ---- Code-quality gate (active when a Sonar project key is supplied) ----
  quality:
    # Self-hosted SonarQube for both profiles: runs only when a project key AND
    # a server URL are provided, so the gate stays skipped (visibly) until the
    # SonarQube add-on exists, then activates by value alone.
    if: ${{ inputs.sonar-project-key != '' && inputs.sonar-host-url != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube scan (self-hosted)
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        with:
          args: >
            -Dsonar.projectKey=${{ inputs.sonar-project-key }}

  # ---- Build ONCE, push by digest ----------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      ref: ${{ inputs.registry }}/${{ inputs.service-name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cloud legs: inactive until roadmap task 1 delivers the OIDC role + ECR.
      - name: Configure AWS credentials (OIDC)
        if: ${{ inputs.cloud-enabled }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        if: ${{ inputs.cloud-enabled }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (digest is the identity)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          # Immutable git-sha handle only; promotion uses the digest, never a
          # moving tag and never `latest` (FR-006).
          tags: ${{ inputs.registry }}/${{ inputs.service-name }}:${{ github.sha }}
          provenance: false

  # ---- Image vulnerability scan (active, blocking) -----------------------
  image-scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy scan (blocking on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ needs.build.outputs.ref }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # ---- Supply-chain evidence (active) ------------------------------------
  sbom:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: MicroTodoSuite/.github/.github/actions/sbom@v1
        with:
          image-ref: ${{ needs.build.outputs.ref }}
          artifact-name: sbom-${{ inputs.service-name }}

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: MicroTodoSuite/.github/.github/actions/sign@v1
        with:
          image-ref: ${{ needs.build.outputs.ref }}

  # ---- Convention-based test gates (spec 006) ----------------------------
  # Each gate runs the service's `ci/<gate>.sh` entrypoint when its switch is
  # on; a missing script fails visibly (enabled-but-empty, FR-012). Per-service
  # order is unit -> contract -> integration -> e2e/perf/dast; a service only
  # ships the scripts it has authored.
  integration:
    if: ${{ inputs.run-integration }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MicroTodoSuite/.github/.github/actions/setup-stack@v1
        with:
          language: ${{ inputs.language }}
      - name: Run integration suite (fail visibly if enabled but no artifact)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ci/integration.sh ]; then
            echo "::error::run-integration=true but ci/integration.sh is missing for ${{ inputs.service-name }}"
            echo "Author the integration suite and add ci/integration.sh before enabling the gate (FR-012)."
            exit 1
          fi
          bash ci/integration.sh

  contract:
    if: ${{ inputs.run-contract }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MicroTodoSuite/.github/.github/actions/setup-stack@v1
        with:
          language: ${{ inputs.language }}
      - name: Run contract suite (fail visibly if enabled but no artifact)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ci/contract.sh ]; then
            echo "::error::run-contract=true but ci/contract.sh is missing for ${{ inputs.service-name }}"
            echo "Author the OpenAPI/AsyncAPI contract + checks and add ci/contract.sh before enabling the gate (FR-012)."
            exit 1
          fi
          bash ci/contract.sh

  e2e:
    if: ${{ inputs.run-e2e }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MicroTodoSuite/.github/.github/actions/setup-stack@v1
        with:
          language: ${{ inputs.language }}
      - name: Run e2e suite (fail visibly if enabled but no artifact)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ci/e2e.sh ]; then
            echo "::error::run-e2e=true but ci/e2e.sh is missing for ${{ inputs.service-name }}"
            echo "Author the Cypress suite + stack and add ci/e2e.sh before enabling the gate (FR-012)."
            exit 1
          fi
          bash ci/e2e.sh

  perf:
    if: ${{ inputs.run-perf }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MicroTodoSuite/.github/.github/actions/setup-stack@v1
        with:
          language: ${{ inputs.language }}
      - name: Run performance suite (fail visibly if enabled but no artifact)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ci/perf.sh ]; then
            echo "::error::run-perf=true but ci/perf.sh is missing for ${{ inputs.service-name }}"
            echo "Author the Locust scenario + baseline and add ci/perf.sh before enabling the gate (FR-012)."
            exit 1
          fi
          bash ci/perf.sh

  dast:
    if: ${{ inputs.run-dast }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MicroTodoSuite/.github/.github/actions/setup-stack@v1
        with:
          language: ${{ inputs.language }}
      - name: Run DAST suite (fail visibly if enabled but no artifact)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ci/dast.sh ]; then
            echo "::error::run-dast=true but ci/dast.sh is missing for ${{ inputs.service-name }}"
            echo "Author the OWASP ZAP baseline and add ci/dast.sh before enabling the gate (FR-012)."
            exit 1
          fi
          bash ci/dast.sh
