name: ci

# Build and verify once, publish only a reviewed main revision, and expose the
# immutable ECR digest consumed by GitOps. No workflow in this repository
# mutates a Kubernetes cluster.

on:
  workflow_call:
    inputs:
      service-name:
        description: Service identity; must match the neutral ECR repository suffix
        required: true
        type: string
      language:
        description: go | node | java | python
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile
        default: Dockerfile
        type: string
      test-command:
        description: Exact repository-owned test command
        required: true
        type: string
      source-audit-command:
        description: Optional lockfile or source dependency audit command
        default: ""
        type: string
      contract-command:
        description: >
          Optional contract gate command (spec 007): OpenAPI/AsyncAPI lint +
          conformance + Pact. Runs on Node regardless of service language and
          gates publication. Value-activated: when set, it must pass.
        default: ""
        type: string
      ecr-repository:
        description: Exact environment-neutral ECR repository URI
        required: true
        type: string
      publisher-role-arn:
        description: Terraform-owned GitHub OIDC publisher role ARN
        required: true
        type: string
      aws-region:
        description: AWS region containing the neutral repositories
        default: us-east-1
        type: string
      sonar-project-key:
        description: SonarQube project key; quality runs when key, host, and token are configured
        default: ""
        type: string
      sonar-host-url:
        description: Self-hosted SonarQube URL
        default: ""
        type: string
      sonar-required:
        description: >-
          Fail closed on the SonarQube quality gate (spec 009 T102). When true,
          an eligible run whose sonar-project-key, sonar-host-url or SONAR_TOKEN
          is missing fails instead of silently skipping the gate. A service sets
          it true once its Sonar project is bootstrapped (T111); economical
          callers keep the default and are unaffected.
        default: false
        type: boolean
    secrets:
      SONAR_TOKEN:
        required: false
    outputs:
      image-digest:
        description: sha256 digest published by an eligible main run
        value: ${{ jobs.supply-chain.outputs.digest }}
      image-ref:
        description: environment-neutral ECR repository at the immutable digest
        value: ${{ jobs.supply-chain.outputs.ref }}

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
      ref: ${{ steps.resolve.outputs.ref }}
    env:
      LOCAL_IMAGE: ${{ inputs.ecr-repository }}:${{ github.sha }}
    steps:
      - name: Validate immutable publication inputs
        shell: bash
        env:
          SERVICE_NAME: ${{ inputs.service-name }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          AWS_REGION_INPUT: ${{ inputs.aws-region }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || {
            echo "::error::organization variable AWS_ACCOUNT_ID must be the 12-digit AWS account"
            exit 1
          }
          # ops spec 004 renames the registry: microtodosuite/<service> becomes
          # lex-mts-shd-ecr-<key>. Both are accepted while the rebuild runs; the
          # legacy path goes when ops spec 004 T026 deletes the old repositories.
          case "$SERVICE_NAME" in
            auth-api) image_key=authapi ;;
            frontend) image_key=frontend ;;
            log-message-processor) image_key=logmsgproc ;;
            todos-api) image_key=todosapi ;;
            users-api) image_key=usersapi ;;
            *) echo "::error::unsupported service-name: $SERVICE_NAME"; exit 1 ;;
          esac
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION_INPUT}.amazonaws.com"
          rebuilt="${registry}/lex-mts-shd-ecr-${image_key}"
          legacy="${registry}/microtodosuite/${SERVICE_NAME}"
          [[ "$ECR_REPOSITORY" == "$rebuilt" || "$ECR_REPOSITORY" == "$legacy" ]] || {
            echo "::error::ecr-repository must be $rebuilt, or $legacy until ops spec 004 retires it"
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: ${{ inputs.language == 'go' }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"

      - name: Set up Node.js
        if: ${{ inputs.language == 'node' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Set up Java
        if: ${{ inputs.language == 'java' }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        if: ${{ inputs.language == 'python' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Reject unsupported language
        if: ${{ !contains(fromJSON('["go","node","java","python"]'), inputs.language) }}
        shell: bash
        run: |
          echo "::error::unsupported language '${{ inputs.language }}' (expected go|node|java|python)"
          exit 1

      - name: Run source dependency audit
        if: ${{ inputs.source-audit-command != '' }}
        shell: bash
        run: ${{ inputs.source-audit-command }}

      - name: Reject an empty test-command
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          if [[ -z "${TEST_COMMAND// /}" ]]; then
            echo "::error::test-command must not be empty or blank -- an empty run: step succeeds having tested nothing (FR-017: a gate must fail visibly, never pass silently)"
            exit 1
          fi

      - name: Run repository tests
        shell: bash
        run: ${{ inputs.test-command }}

      # ---- Contract gate (spec 007): value-activated, gates publication -------
      - name: Set up Node for contract tooling
        if: ${{ inputs.contract-command != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Run contract checks (OpenAPI/AsyncAPI lint + conformance + Pact)
        if: ${{ inputs.contract-command != '' }}
        shell: bash
        run: ${{ inputs.contract-command }}

      - name: Require the SonarQube quality gate when fail-closed
        if: ${{ inputs.sonar-required }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${{ inputs.sonar-project-key }}" ]] || missing+=("sonar-project-key")
          [[ -n "${{ inputs.sonar-host-url }}" ]] || missing+=("sonar-host-url")
          [[ -n "${SONAR_TOKEN:-}" ]] || missing+=("SONAR_TOKEN")
          if [[ "${#missing[@]}" -ne 0 ]]; then
            echo "::error::the SonarQube quality gate is required but not configured: ${missing[*]}"
            exit 1
          fi

      - name: SonarQube quality gate
        if: ${{ inputs.sonar-project-key != '' && inputs.sonar-host-url != '' }}
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        with:
          args: -Dsonar.projectKey=${{ inputs.sonar-project-key }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image once locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          provenance: false

      - name: Scan the exact local image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          version: v0.72.0

      - name: Generate the exact local image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Retain SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ inputs.service-name }}-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate reviewed-main publication boundary
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'MicroTodoSuite' }}
        shell: bash
        env:
          PUBLISHER_ROLE_ARN: ${{ inputs.publisher-role-arn }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || {
            echo "::error::organization variable AWS_ACCOUNT_ID must be the 12-digit AWS account"
            exit 1
          }
          # The publisher role is renamed by the same rebuild; both are accepted
          # until ops spec 004 retires the legacy one.
          rebuilt_role="arn:aws:iam::${AWS_ACCOUNT_ID}:role/lex-mts-shd-role-ecrpublish"
          legacy_role="arn:aws:iam::${AWS_ACCOUNT_ID}:role/microtodosuite-github-ecr-publisher"
          [[ "$PUBLISHER_ROLE_ARN" == "$rebuilt_role" || "$PUBLISHER_ROLE_ARN" == "$legacy_role" ]] || {
            echo "::error::publisher-role-arn is not a Terraform-owned publisher role"
            exit 1
          }

      - name: Configure AWS credentials through GitHub OIDC
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'MicroTodoSuite' }}
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ inputs.publisher-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to Amazon ECR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'MicroTodoSuite' }}
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Push the already-tested image once
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'MicroTodoSuite' }}
        shell: bash
        run: docker push "$LOCAL_IMAGE"

      - name: Resolve the immutable ECR digest
        id: resolve
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'MicroTodoSuite' }}
        shell: bash
        env:
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          AWS_REGION_INPUT: ${{ inputs.aws-region }}
        run: |
          set -euo pipefail
          repository_name="${ECR_REPOSITORY#*/}"
          digest="$(aws ecr describe-images \
            --region "$AWS_REGION_INPUT" \
            --repository-name "$repository_name" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::ECR did not return an immutable sha256 digest"
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=${ECR_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'MicroTodoSuite' }}
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Attach SBOM and keylessly sign the immutable digest
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'MicroTodoSuite' }}
        shell: bash
        env:
          IMAGE_REF: ${{ steps.resolve.outputs.ref }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign attest --predicate sbom.spdx.json --type spdxjson "$IMAGE_REF"
          cosign sign "$IMAGE_REF"
