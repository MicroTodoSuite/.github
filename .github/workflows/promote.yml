name: promote

# Reusable promotion workflow (spec 003). Opens a pull request against the GitOps
# repo that bumps ONE environment overlay's image digest, using the repo's own
# digest-only helper. It never mutates a cluster; ArgoCD reconciles the merge.
# Rollback is a git revert of the resulting commit.

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      environment:
        description: dev | staging | prod
        required: true
        type: string
      profile:
        description: >-
          Runtime profile that owns the overlay. `economical` is the working
          platform and stays the default so existing callers are unaffected.
        default: economical
        type: string
      destination:
        description: >-
          Cluster the overlay is activated on. Together with profile and
          environment this forms the tuple bump-image.sh validates, so a digest
          can only ever land on a registered destination.
        default: eks-dev
        type: string
      strategy:
        description: >-
          Rollout strategy the destination overlay uses. `rolling` for
          economical dev/staging and full dev/staging; `canary` only for full
          AWS production; `dr-rolling` only for AKS DR after production
          validation (spec 009 T104/T110/T131).
        default: rolling
        type: string
      image-digest:
        description: sha256:<64hex> produced by ci.yml
        required: true
        type: string
      image-ref:
        description: registry/service@digest, used to verify provenance
        required: true
        type: string
      gitops-repo:
        default: MicroTodoSuite/microservice-app-gitops
        type: string
      publisher-role-arn:
        description: OIDC role that can read ECR to verify the image signature
        required: true
        type: string
      aws-region:
        default: us-east-1
        type: string
      dr-ecr-reader-role-arn:
        description: OIDC role allowed to read the production ECR artifact for DR
        default: ""
        type: string
      dr-seed-role-arn:
        description: OIDC role allowed to read the four approved AWS secrets
        default: ""
        type: string
      dr-acr-name:
        description: Terraform-owned ACR registry name for the DR mirror
        default: ""
        type: string
      dr-acr-client-id:
        description: Federated Azure identity client ID scoped to ACR push
        default: ""
        type: string
      dr-seed-client-id:
        description: Federated Azure identity client ID scoped to Key Vault get/set
        default: ""
        type: string
      dr-azure-tenant-id:
        description: Approved Azure tenant ID for the DR federated identities
        default: ""
        type: string
      dr-azure-subscription-id:
        description: Approved Azure subscription ID holding ACR and Key Vault
        default: ""
        type: string
      dr-key-vault-name:
        description: Terraform-owned DR Key Vault name
        default: ""
        type: string
      dr-github-environment:
        description: Approved GitHub environment trusted by the DR seed role
        default: ""
        type: string
    secrets:
      gitops-promote-app-id:
        description: >-
          GitHub App id of the gitops promoter App. Callers wire the
          organization secret GITOPS_PROMOTE_APP_ID here (spec 009 T099).
        required: false
      gitops-promote-app-key:
        description: >-
          GitHub App private key (PEM) of the gitops promoter App. Callers wire
          the organization secret GITOPS_PROMOTE_APP_KEY here (spec 009 T099).
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate digest, profile, destination and strategy
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PROFILE: ${{ inputs.profile }}
          DESTINATION: ${{ inputs.destination }}
          STRATEGY: ${{ inputs.strategy }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] \
            || { echo "::error::image-digest is not sha256:<64 hex>"; exit 1; }

          # Preserve the existing AWS tuples. DR adds only the production/full
          # rolling destination and never repeats the AWS canary (T131).
          case "$PROFILE" in economical|full) ;; *) echo "::error::unknown profile: $PROFILE"; exit 1 ;; esac
          case "$STRATEGY" in rolling|canary|dr-rolling) ;; *) echo "::error::unknown strategy: $STRATEGY"; exit 1 ;; esac
          if [[ "$DESTINATION" == "aks-dr" ]]; then
            [[ "$ENVIRONMENT/$PROFILE/$STRATEGY" == "prod/full/dr-rolling" ]] || {
              echo "::error::AKS DR requires prod/full/aks-dr/dr-rolling"; exit 1
            }
          else
            case "$PROFILE/$DESTINATION" in
              economical/eks-dev) ;;
              full/eks-full-dev|full/eks-full-staging|full/eks-full-prod) ;;
              *) echo "::error::unregistered profile/destination tuple: $PROFILE/$DESTINATION"; exit 1 ;;
            esac
            if [[ "$STRATEGY" == "dr-rolling" ]]; then
              echo "::error::dr-rolling is only valid for aks-dr"; exit 1
            fi
            if [[ "$STRATEGY" == "canary" && "$PROFILE/$DESTINATION" != "full/eks-full-prod" ]]; then
              echo "::error::canary is only valid for full/eks-full-prod"; exit 1
            fi
          fi

      - name: Validate DR identity inputs
        if: ${{ inputs.destination == 'aks-dr' }}
        shell: bash
        env:
          ECR_READER_ROLE_ARN: ${{ inputs.dr-ecr-reader-role-arn }}
          SEED_ROLE_ARN: ${{ inputs.dr-seed-role-arn }}
          ACR_NAME: ${{ inputs.dr-acr-name }}
          ACR_CLIENT_ID: ${{ inputs.dr-acr-client-id }}
          SEED_CLIENT_ID: ${{ inputs.dr-seed-client-id }}
          AZURE_TENANT_ID: ${{ inputs.dr-azure-tenant-id }}
          AZURE_SUBSCRIPTION_ID: ${{ inputs.dr-azure-subscription-id }}
          KEY_VAULT_NAME: ${{ inputs.dr-key-vault-name }}
          GITHUB_ENVIRONMENT: ${{ inputs.dr-github-environment }}
        run: |
          set -euo pipefail
          for name in ECR_READER_ROLE_ARN SEED_ROLE_ARN ACR_NAME ACR_CLIENT_ID SEED_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID KEY_VAULT_NAME GITHUB_ENVIRONMENT; do
            [[ -n "${!name}" ]] || { echo "::error::missing DR input: $name"; exit 1; }
          done

  mirror-to-acr:
    needs: validate
    if: ${{ inputs.destination == 'aks-dr' }}
    uses: ./.github/workflows/mirror-to-acr.yml
    with:
      service-name: ${{ inputs.service-name }}
      image-digest: ${{ inputs.image-digest }}
      image-ref: ${{ inputs.image-ref }}
      ecr-reader-role-arn: ${{ inputs.dr-ecr-reader-role-arn }}
      acr-name: ${{ inputs.dr-acr-name }}
      azure-client-id: ${{ inputs.dr-acr-client-id }}
      azure-tenant-id: ${{ inputs.dr-azure-tenant-id }}
      azure-subscription-id: ${{ inputs.dr-azure-subscription-id }}
      aws-region: ${{ inputs.aws-region }}

  sync-dr-secrets:
    needs: mirror-to-acr
    if: ${{ inputs.destination == 'aks-dr' }}
    uses: ./.github/workflows/sync-dr-secrets.yml
    with:
      github-environment: ${{ inputs.dr-github-environment }}
      aws-region: ${{ inputs.aws-region }}
      seed-role-arn: ${{ inputs.dr-seed-role-arn }}
      azure-client-id: ${{ inputs.dr-seed-client-id }}
      azure-tenant-id: ${{ inputs.dr-azure-tenant-id }}
      azure-subscription-id: ${{ inputs.dr-azure-subscription-id }}
      key-vault-name: ${{ inputs.dr-key-vault-name }}

  open-promotion-pr:
    needs: validate
    if: ${{ inputs.destination != 'aks-dr' }}
    runs-on: ubuntu-latest
    steps:
      # Cosign reads the signature artifact from the private ECR registry, so the
      # job must authenticate to ECR (OIDC) before verifying.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ inputs.publisher-role-arn }}
          aws-region: ${{ inputs.aws-region }}
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # FR-011: never promote an artifact CI did not build+sign. Verify the
      # keyless Cosign signature for this exact digest before opening the PR.
      - name: Verify image signature (provenance)
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Cosign verify
        shell: bash
        run: |
          set -euo pipefail
          cosign verify "${{ inputs.image-ref }}" \
            --certificate-identity-regexp 'https://github.com/MicroTodoSuite/.+' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            >/dev/null \
            || { echo "::error::no valid signature for ${{ inputs.image-ref }} — refusing to promote"; exit 1; }

      - name: Require GitOps promotion App credentials
        shell: bash
        env:
          APP_ID: ${{ secrets.gitops-promote-app-id }}
          APP_KEY: ${{ secrets.gitops-promote-app-key }}
        run: |
          set -euo pipefail
          [[ -n "$APP_ID" && -n "$APP_KEY" ]] || {
            echo "::error::GitOps promotion App credentials are required for an AWS destination"
            exit 1
          }

      - name: Generate gitops token (GitHub App)
        id: apptoken
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.gitops-promote-app-id }}
          private-key: ${{ secrets.gitops-promote-app-key }}
          owner: MicroTodoSuite
          repositories: microservice-app-gitops

      - name: Checkout GitOps repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.gitops-repo }}
          token: ${{ steps.apptoken.outputs.token }}
          path: gitops
          fetch-depth: 0

      # Installed by checksum from the GitOps repo's own toolchain lock rather
      # than by piping an unpinned installer from `master`: this job renders the
      # manifest that decides what reaches a cluster.
      - name: Install checksum-locked kustomize
        working-directory: gitops
        run: |
          set -euo pipefail
          url="$(jq -er '.tools[] | select(.name == "kustomize") | .source' scripts/managed/full-profile-toolchain.lock)"
          checksum="$(jq -er '.tools[] | select(.name == "kustomize") | .sha256' scripts/managed/full-profile-toolchain.lock)"
          archive="$(mktemp)"
          extract_dir="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "$url" --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$extract_dir" kustomize
          sudo install -m 0755 "$extract_dir/kustomize" /usr/local/bin/kustomize
          kustomize version

      - name: Bump digest (digest-only helper, commits on a branch)
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          BR="promote/${{ inputs.service-name }}-${{ inputs.profile }}-${{ inputs.environment }}-${GITHUB_SHA::7}"
          git config user.name "microtodo-ci[bot]"
          git config user.email "ci@microtodosuite.local"
          git checkout -b "$BR"
          scripts/bump-image.sh \
            "${{ inputs.service-name }}" \
            "${{ inputs.environment }}" \
            "${{ inputs.profile }}" \
            "${{ inputs.destination }}" \
            "${{ inputs.image-digest }}"
          git push origin "$BR"

      - name: Open pull request
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          SERVICE_NAME: ${{ inputs.service-name }}
          PROFILE: ${{ inputs.profile }}
          ENVIRONMENT: ${{ inputs.environment }}
          DESTINATION: ${{ inputs.destination }}
          STRATEGY: ${{ inputs.strategy }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          BR="promote/${SERVICE_NAME}-${PROFILE}-${ENVIRONMENT}-${GITHUB_SHA::7}"
          TITLE="promote(${SERVICE_NAME}): ${PROFILE}/${ENVIRONMENT} -> ${IMAGE_DIGEST}"

          # Every section below is required by conventions/validate-pr.py, the
          # same contract a human-authored PR must satisfy. A mechanical bump
          # can state each one truthfully -- ci.yml's gates and this job's own
          # signature check already are the verification, so this is not
          # busywork invented to satisfy the gate, it is what actually happened.
          # A here-doc's body would have to sit flush against the left margin,
          # which a `run: |` block scalar reads as the end of the script -- a
          # printf argument list has no such indentation constraint.
          BODY="$(printf '%s\n' \
            '## What changes' \
            "Bumps \`${SERVICE_NAME}\`'s \`${PROFILE}/${ENVIRONMENT}\` overlay (destination \`${DESTINATION}\`, strategy \`${STRATEGY}\`) to the immutable digest \`${IMAGE_DIGEST}\`, using \`scripts/bump-image.sh\` -- a digest-only rewrite of the overlay's \`images[].digest\`, nothing else." \
            '' \
            '## Why' \
            "\`ci.yml\` built, tested, scanned, and keylessly signed this exact digest for \`${IMAGE_REF}\` on a reviewed \`main\` commit. This automated PR is the only path that digest can reach a GitOps-managed overlay; ArgoCD reconciles the merge." \
            '' \
            '## Tasks' \
            'None. This is a mechanical digest promotion, not feature work -- no `tasks.md` entry applies.' \
            '' \
            '## How it is verified' \
            '- `ci.yml`'"'"'s required gates (tests, contract checks where configured, Trivy scan, SBOM, Cosign sign) passed before this run started.' \
            "- This workflow independently verified the Cosign signature for \`${IMAGE_REF}\` against the GitHub Actions OIDC issuer before writing the digest." \
            "- \`scripts/bump-image.sh\` asserts the rendered overlay resolves to exactly \`newName@${IMAGE_DIGEST}\` before committing." \
            '' \
            '## Risk and rollback' \
            'Low: the digest is the same one CI already gated, and exactly one overlay changes. Rollback is `git revert` this commit; ArgoCD reconciles the previous digest automatically.' \
            '' \
            '## What this PR does not do' \
            'Does not change any other overlay or service, does not rebuild or re-sign the image, and does not touch cluster state directly -- ArgoCD reconciles the merge.' \
            '' \
            '- [x] Infrastructure changes: the documentation consulted through the required MCP servers is listed above' \
            '' \
            'No new MCP documentation lookup applies here: this is a mechanical digest-only rewrite performed by the already-reviewed `scripts/bump-image.sh` contract (spec 001), not a new infrastructure design decision.')"

          gh pr create --repo "${{ inputs.gitops-repo }}" --head "$BR" --base main \
            --title "$TITLE" --body "$BODY"
