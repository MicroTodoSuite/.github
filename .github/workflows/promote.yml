name: promote

# Reusable promotion workflow (spec 003). Opens a pull request against the GitOps
# repo that bumps ONE environment overlay's image digest, using the repo's own
# digest-only helper. It never mutates a cluster; ArgoCD reconciles the merge.
# Rollback is a git revert of the resulting commit.

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      environment:
        description: dev | staging | prod
        required: true
        type: string
      profile:
        description: >-
          Runtime profile that owns the overlay. `economical` is the working
          platform and stays the default so existing callers are unaffected.
        default: economical
        type: string
      destination:
        description: >-
          Cluster the overlay is activated on. Together with profile and
          environment this forms the tuple bump-image.sh validates, so a digest
          can only ever land on a registered destination.
        default: eks-dev
        type: string
      strategy:
        description: >-
          Rollout strategy the destination overlay uses. `rolling` for
          economical dev/staging and full dev/staging; `canary` only for full
          AWS production (spec 009 T104/T110). Validated against the
          profile/destination below so a canary can never target a rolling
          destination.
        default: rolling
        type: string
      image-digest:
        description: sha256:<64hex> produced by ci.yml
        required: true
        type: string
      image-ref:
        description: registry/service@digest, used to verify provenance
        required: true
        type: string
      gitops-repo:
        default: MicroTodoSuite/microservice-app-gitops
        type: string
      publisher-role-arn:
        description: OIDC role that can read ECR to verify the image signature
        required: true
        type: string
      aws-region:
        default: us-east-1
        type: string
    secrets:
      gitops-promote-app-id:
        description: >-
          GitHub App id of the gitops promoter App. Callers wire the
          organization secret GITOPS_PROMOTE_APP_ID here (spec 009 T099).
        required: true
      gitops-promote-app-key:
        description: >-
          GitHub App private key (PEM) of the gitops promoter App. Callers wire
          the organization secret GITOPS_PROMOTE_APP_KEY here (spec 009 T099).
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  open-promotion-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Validate digest, profile, destination and strategy
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          DESTINATION: ${{ inputs.destination }}
          STRATEGY: ${{ inputs.strategy }}
        run: |
          set -euo pipefail
          [[ "${{ inputs.image-digest }}" =~ ^sha256:[a-f0-9]{64}$ ]] \
            || { echo "::error::image-digest is not sha256:<64 hex>"; exit 1; }

          # Profile, destination and strategy are an allowlisted tuple, not free
          # text: a digest can only ever land on a registered destination, and a
          # canary can only ever target full AWS production (T104/T110).
          case "$PROFILE" in economical|full) ;; *) echo "::error::unknown profile: $PROFILE"; exit 1 ;; esac
          case "$STRATEGY" in rolling|canary) ;; *) echo "::error::unknown strategy: $STRATEGY"; exit 1 ;; esac
          case "$PROFILE/$DESTINATION" in
            economical/eks-dev) ;;
            full/eks-full-dev|full/eks-full-staging|full/eks-full-prod) ;;
            *) echo "::error::unregistered profile/destination tuple: $PROFILE/$DESTINATION"; exit 1 ;;
          esac
          if [[ "$STRATEGY" == "canary" && "$PROFILE/$DESTINATION" != "full/eks-full-prod" ]]; then
            echo "::error::canary is only valid for full/eks-full-prod, not $PROFILE/$DESTINATION"; exit 1
          fi

      # Cosign reads the signature artifact from the private ECR registry, so the
      # job must authenticate to ECR (OIDC) before verifying.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ inputs.publisher-role-arn }}
          aws-region: ${{ inputs.aws-region }}
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # FR-011: never promote an artifact CI did not build+sign. Verify the
      # keyless Cosign signature for this exact digest before opening the PR.
      - name: Verify image signature (provenance)
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Cosign verify
        shell: bash
        run: |
          set -euo pipefail
          cosign verify "${{ inputs.image-ref }}" \
            --certificate-identity-regexp 'https://github.com/MicroTodoSuite/.+' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            >/dev/null \
            || { echo "::error::no valid signature for ${{ inputs.image-ref }} — refusing to promote"; exit 1; }

      - name: Generate gitops token (GitHub App)
        id: apptoken
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.gitops-promote-app-id }}
          private-key: ${{ secrets.gitops-promote-app-key }}
          owner: MicroTodoSuite
          repositories: microservice-app-gitops

      - name: Checkout GitOps repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.gitops-repo }}
          token: ${{ steps.apptoken.outputs.token }}
          path: gitops
          fetch-depth: 0

      # Installed by checksum from the GitOps repo's own toolchain lock rather
      # than by piping an unpinned installer from `master`: this job renders the
      # manifest that decides what reaches a cluster.
      - name: Install checksum-locked kustomize
        working-directory: gitops
        run: |
          set -euo pipefail
          url="$(jq -er '.tools[] | select(.name == "kustomize") | .source' scripts/managed/full-profile-toolchain.lock)"
          checksum="$(jq -er '.tools[] | select(.name == "kustomize") | .sha256' scripts/managed/full-profile-toolchain.lock)"
          archive="$(mktemp)"
          extract_dir="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "$url" --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$extract_dir" kustomize
          sudo install -m 0755 "$extract_dir/kustomize" /usr/local/bin/kustomize
          kustomize version

      - name: Bump digest (digest-only helper, commits on a branch)
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          BR="promote/${{ inputs.service-name }}-${{ inputs.profile }}-${{ inputs.environment }}-${GITHUB_SHA::7}"
          git config user.name "microtodo-ci[bot]"
          git config user.email "ci@microtodosuite.local"
          git checkout -b "$BR"
          scripts/bump-image.sh \
            "${{ inputs.service-name }}" \
            "${{ inputs.environment }}" \
            "${{ inputs.profile }}" \
            "${{ inputs.destination }}" \
            "${{ inputs.image-digest }}"
          git push origin "$BR"

      - name: Open pull request
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          BR="promote/${{ inputs.service-name }}-${{ inputs.profile }}-${{ inputs.environment }}-${GITHUB_SHA::7}"
          TITLE="promote(${{ inputs.service-name }}): ${{ inputs.profile }}/${{ inputs.environment }} -> ${{ inputs.image-digest }}"
          BODY=$(printf 'Automated promotion.\n\n- Service: %s\n- Profile: %s\n- Environment: %s\n- Destination: %s\n- Digest: %s\n\nRollback: git revert this commit.' \
                 "${{ inputs.service-name }}" "${{ inputs.profile }}" "${{ inputs.environment }}" \
                 "${{ inputs.destination }}" "${{ inputs.image-digest }}")
          gh pr create --repo "${{ inputs.gitops-repo }}" --head "$BR" --base main \
            --title "$TITLE" --body "$BODY"
