name: release

# Reusable release workflow (spec 003, D11). semantic-release computes the next
# version and changelog from Conventional Commits. The version is metadata; the
# image DIGEST from ci.yml remains the deployment identity. Authenticates with an
# org-owned GitHub App (short-lived installation token) instead of a personal PAT.

on:
  workflow_call:
    inputs:
      node-version:
        default: "22"
        type: string
    secrets:
      release-app-id:
        description: Release GitHub App id (contents+issues+PR write on the service repos)
        required: true
      release-app-key:
        description: Release GitHub App private key (PEM)
        required: true
    outputs:
      released:
        description: "true when a new version was published"
        value: ${{ jobs.release.outputs.released }}
      version:
        description: The published version (empty if none)
        value: ${{ jobs.release.outputs.version }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - name: Mint a GitHub App installation token
        id: apptoken
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.release-app-id }}
          private-key: ${{ secrets.release-app-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.apptoken.outputs.token }}
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        id: semrel
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4.2.2
        env:
          GITHUB_TOKEN: ${{ steps.apptoken.outputs.token }}
