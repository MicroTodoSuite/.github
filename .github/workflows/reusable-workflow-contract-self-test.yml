name: reusable-workflow contract self-test

# Runs the reusable-workflow contract (gitops spec 009 T099) at this commit, so a
# change to ci/release/promote that drops a required guarantee — a coverage gate,
# Sonar fail-closed, digest-only output, OIDC without static creds, a SHA pin, a
# validated destination tuple, no cluster mutation — fails its own pull request.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/promote.yml"
      - ".github/workflows/reusable-workflow-contract-self-test.yml"
      - "tests/workflows/reusable-workflow-contract.bats"
      - "tests/workflows/quality-gate-matrix.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/promote.yml"
      - "tests/workflows/reusable-workflow-contract.bats"
      - "tests/workflows/quality-gate-matrix.yaml"

permissions:
  contents: read

jobs:
  contract-test:
    name: reusable-workflow contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the reusable-workflow contract
        run: bash tests/workflows/reusable-workflow-contract.bats
