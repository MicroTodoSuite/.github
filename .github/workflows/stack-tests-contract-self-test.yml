name: stack-tests contract self-test

# Runs the stack-tests contract (gitops spec 007 T027) at this commit, so a
# change to stack-tests.yml that drops the empty-stack-command guard fails its
# own pull request.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stack-tests.yml"
      - ".github/workflows/stack-tests-contract-self-test.yml"
      - "tests/workflows/stack-tests-contract.bats"
  push:
    branches: [main]
    paths:
      - ".github/workflows/stack-tests.yml"
      - "tests/workflows/stack-tests-contract.bats"

permissions:
  contents: read

jobs:
  contract-test:
    name: stack-tests contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the stack-tests contract
        run: bash tests/workflows/stack-tests-contract.bats
