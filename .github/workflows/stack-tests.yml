name: stack-tests

# Reusable stack-level test gate (spec 007): brings up the caller's docker-compose
# stack — optionally alongside sibling service repos it builds from — runs a
# provided command (Playwright e2e, Locust performance, or OWASP ZAP DAST), and
# always tears the stack down. Kept central so no repo copy-pastes this
# orchestration; the caller supplies the compose file, the command, and (for a
# multi-service stack) the sibling repos to check out.

on:
  workflow_call:
    inputs:
      gate-name:
        description: Human-readable gate label (e2e | performance | dast)
        required: true
        type: string
      compose-file:
        description: Path to the compose file, relative to the caller repo root
        default: e2e/compose.yaml
        type: string
      stack-command:
        description: Command that runs the gate against the running stack
        required: true
        type: string
      ready-command:
        description: Optional command that blocks until the stack is healthy
        default: ""
        type: string
      stack-repos:
        description: >
          Optional space-separated sibling repo names (same org) to check out
          next to the caller so the compose file can build them.
        default: ""
        type: string

permissions:
  contents: read

jobs:
  stack-tests:
    runs-on: ubuntu-latest
    env:
      CALLER_DIR: ${{ github.event.repository.name }}
    steps:
      - name: Check out the caller repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ${{ github.event.repository.name }}

      - name: Check out sibling service repos
        if: ${{ inputs.stack-repos != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for repo in ${{ inputs.stack-repos }}; do
            git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${repo}.git" "${repo}"
          done

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Bring up the stack
        shell: bash
        run: docker compose -f "${CALLER_DIR}/${{ inputs.compose-file }}" up -d --build

      - name: Wait for readiness
        if: ${{ inputs.ready-command != '' }}
        shell: bash
        run: ${{ inputs.ready-command }}

      - name: Run ${{ inputs.gate-name }} gate
        shell: bash
        run: ${{ inputs.stack-command }}

      - name: Tear down the stack
        if: ${{ always() }}
        shell: bash
        run: docker compose -f "${CALLER_DIR}/${{ inputs.compose-file }}" down -v
