name: dr secret seed self-test

# Runs the DR secret seed's contract test on every change to the workflow or
# its test, the same self-test pattern as mirror-platform-images-self-test.yml.
# The seed itself needs the Terraform-owned AWS read role, the Azure DR Key
# Vault and its federated identity (spec 009), so it cannot run in CI; this
# proves its contract, including the mock-cloud behavior, holds at the same
# commit.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sync-dr-secrets.yml"
      - ".github/workflows/sync-dr-secrets-self-test.yml"
      - ".github/workflows/promote.yml"
      - "tests/workflows/sync-dr-secrets.bats"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-dr-secrets.yml"
      - ".github/workflows/sync-dr-secrets-self-test.yml"
      - ".github/workflows/promote.yml"
      - "tests/workflows/sync-dr-secrets.bats"

permissions:
  contents: read

jobs:
  contract-test:
    name: contract test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the DR secret seed contract test
        run: bash tests/workflows/sync-dr-secrets.bats
