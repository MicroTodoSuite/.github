name: sync dr secrets

# Seeds the Azure disaster-recovery Key Vault with exactly the four approved
# runtime secrets held in AWS Secrets Manager (gitops spec 009 T131, research
# Decision 14, data-model SecretTransfer). The production JWT is copied byte for
# byte so a token stays valid when a request moves between AWS and Azure; the
# notification and Grafana-admin values keep the same approved contract.
#
# Value custody: nothing here persists a value. Both clouds are reached through
# short-lived GitHub OIDC sessions (no static credential, no caller secret).
# Shell tracing is off, every fetched value is masked before any other
# operation, a value exists only in process memory or in one mode-0600 file
# inside a mode-0700 RUNNER_TEMP directory that an EXIT trap removes on every
# path, and no cache, artifact, environment file or value-derived digest is
# produced. The only output is the jwt-value-match boolean, computed by an
# in-process equality comparison of the AWS source and the Key Vault read-back.
# Evidence (the step summary) records names and non-secret versions only.
#
# Identity boundary: the AWS read role `microtodosuite-github-dr-secret-seed`
# is separate from the image publisher, trusts only this repository, the named
# GitHub environment and this workflow file, and can read only the four source
# secrets. The Azure identity is federated and holds only get/set data actions
# on the dedicated DR vault. The account is read from `vars.AWS_ACCOUNT_ID`, so
# no account id is hard-coded here. Until Terraform (ops, spec 009) creates the
# role, the vault and the federated identity, this is authored and
# contract-tested but inactive. A rotation reruns this same reviewed workflow.

on:
  workflow_dispatch:
    inputs:
      github-environment:
        description: GitHub environment whose OIDC subject the AWS role and Azure identity trust
        type: string
        default: production
      aws-region:
        description: Region of the AWS Secrets Manager sources
        type: string
        default: us-east-1
      seed-role-arn:
        description: >-
          The Terraform-owned DR secret-seed read role ARN. Defaults to the
          conventional name in the declared account when left empty.
        type: string
        default: ""
      azure-client-id:
        description: Client id of the federated Azure DR secret-seed identity (not a secret)
        type: string
        required: true
      azure-tenant-id:
        description: Azure tenant id (not a secret)
        type: string
        required: true
      azure-subscription-id:
        description: Azure subscription id holding the DR Key Vault (not a secret)
        type: string
        required: true
      key-vault-name:
        description: The Terraform-output Azure DR Key Vault name
        type: string
        required: true
  workflow_call:
    inputs:
      github-environment:
        type: string
        default: production
      aws-region:
        type: string
        default: us-east-1
      seed-role-arn:
        type: string
        default: ""
      azure-client-id:
        type: string
        required: true
      azure-tenant-id:
        type: string
        required: true
      azure-subscription-id:
        type: string
        required: true
      key-vault-name:
        type: string
        required: true
    outputs:
      jwt-value-match:
        description: true only when the Key Vault JWT reads back equal to the AWS source
        value: ${{ jobs.seed.outputs.jwt-value-match }}

permissions:
  contents: read

concurrency:
  group: sync-dr-secrets-${{ inputs.github-environment }}
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.github-environment }}
    permissions:
      contents: read
      id-token: write # OIDC to AWS and Azure; no static credential exists
    outputs:
      jwt-value-match: ${{ steps.seed.outputs.jwt-value-match }}
    steps:
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: >-
            ${{ inputs.seed-role-arn != ''
              && inputs.seed-role-arn
              || format('arn:aws:iam::{0}:role/microtodosuite-github-dr-secret-seed', vars.AWS_ACCOUNT_ID) }}
          role-session-name: dr-secret-seed-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: ${{ inputs.aws-region }}
          mask-aws-account-id: true

      - name: Log in to Azure through GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v2
        with:
          client-id: ${{ inputs.azure-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      - name: Seed the four approved secrets without persisting a value
        id: seed
        shell: bash
        env:
          KEY_VAULT_NAME: ${{ inputs.key-vault-name }}
          AWS_PAGER: ""
        run: |
          set +x
          set -euo pipefail
          ulimit -c 0
          umask 077

          # source=target, exactly the four approved pairs (research Decision 14).
          mapping=(
            "microtodosuite/prod/auth-api-secrets=microtodosuite-prod-auth-api-secrets"
            "microtodosuite/observability/alertmanager-slack-webhook=microtodosuite-observability-alertmanager-slack-webhook"
            "microtodosuite/security/falcosidekick-slack-webhook=microtodosuite-security-falcosidekick-slack-webhook"
            "microtodosuite/observability/grafana-admin=microtodosuite-observability-grafana-admin"
          )
          jwt_target="microtodosuite-prod-auth-api-secrets"

          [[ "$KEY_VAULT_NAME" =~ ^[A-Za-z0-9-]{3,24}$ ]] || {
            echo "::error::key-vault-name is not a valid Key Vault name"; exit 1
          }

          workdir="$(mktemp -d "$RUNNER_TEMP/dr-secret-seed.XXXXXX")"
          cleanup() {
            unset response source_json target_json
            rm -rf "$workdir"
          }
          trap cleanup EXIT
          trap 'exit 143' TERM INT

          # Masks one value line; `%` and CR are escaped as the runner expects.
          mask_line() {
            local line="$1"
            line="${line//'%'/%25}"
            line="${line//$'\r'/%0D}"
            printf '::add-mask::%s\n' "$line"
          }

          # Masks every line of the value, every line of each string field when
          # the value is JSON, and the JSON-escaped single-line form.
          mask_value() {
            printf '%s' "$response" | jq -r '
              (.SecretString // "") as $s
              | ($s | split("\n")[]),
                (($s | fromjson? // empty) | .. | strings | split("\n")[]),
                ($s | tojson | .[1:-1])
            ' | while IFS= read -r line; do
              [[ -n "$line" ]] && mask_line "$line"
            done
            return 0
          }

          {
            echo "### DR secret seed"
            echo
            echo "Key Vault: \`$KEY_VAULT_NAME\`"
            echo
            echo "| AWS source | Key Vault target | source version | target version |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          jwt_match=""
          for pair in "${mapping[@]}"; do
            source="${pair%%=*}"
            target="${pair#*=}"

            # Pin the AWSCURRENT version so the read and the evidence agree.
            source_version="$(aws secretsmanager describe-secret --secret-id "$source" \
              --query VersionIdsToStages --output json \
              | jq -r '[to_entries[] | select(.value | index("AWSCURRENT")) | .key]
                       | if length == 1 then .[0] else error("no single AWSCURRENT version") end')"
            [[ "$source_version" =~ ^[A-Za-z0-9-]{1,64}$ ]] || {
              echo "::error::$source has no usable AWSCURRENT version id"; exit 1
            }

            response="$(aws secretsmanager get-secret-value --secret-id "$source" \
              --version-id "$source_version" --output json)"
            mask_value
            printf '%s' "$response" | jq -e --arg v "$source_version" \
              '(.SecretString | type == "string") and .VersionId == $v' > /dev/null || {
              echo "::error::$source did not return a string value at version $source_version"; exit 1
            }

            # The CLI reads the value from a file, never from its command line.
            file="$workdir/$target"
            printf '%s' "$response" | jq -j '.SecretString' > "$file"
            az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name "$target" \
              --file "$file" --encoding utf-8 --output none --only-show-errors
            rm -f "$file"

            target_id="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$target" \
              --query id --output tsv --only-show-errors)"
            target_version="${target_id##*/}"
            [[ "$target_version" =~ ^[A-Za-z0-9-]{1,64}$ ]] || {
              echo "::error::$target has no usable version id"; exit 1
            }
            echo "| \`$source\` | \`$target\` | \`$source_version\` | \`$target_version\` |" >> "$GITHUB_STEP_SUMMARY"

            if [[ "$target" == "$jwt_target" ]]; then
              # In-process equality of the canonical JSON strings: nothing is
              # retained, hashed or printed, only the boolean survives.
              source_json="$(printf '%s' "$response" | jq -c '.SecretString')"
              target_json="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$target" \
                --query value --output json --only-show-errors | jq -c '.')"
              if [[ "$source_json" == "$target_json" ]]; then jwt_match=true; else jwt_match=false; fi
              unset source_json target_json
              if [[ "$jwt_match" != true ]]; then
                echo "jwt-value-match=false" >> "$GITHUB_OUTPUT"
                echo "jwt-value-match: \`false\` (blocked)" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::the Key Vault JWT does not equal the AWS production JWT; the transfer is blocked"
                exit 1
              fi
            fi
            unset response
          done

          [[ "$jwt_match" == true ]] || { echo "::error::the production JWT was never compared"; exit 1; }
          echo "jwt-value-match=true" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "jwt-value-match: \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "seeded ${#mapping[@]} secrets into $KEY_VAULT_NAME; jwt-value-match=true"
